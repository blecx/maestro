name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run static checks
        run: |
          python scripts/check_neutrality.py
          python scripts/check_variable_contract.py
          python scripts/check_boundaries.py
          python scripts/check_vscode_workspace.py
          python scripts/check_docs_accuracy.py
      - name: Run package tests
        run: python -m pytest tests factory_runtime/tests -q --tb=short
      - name: Run smoke scripts
        run: |
          python scripts/test_fresh_install.py
          python scripts/test_upgrade_path.py
          python scripts/test_dual_host_isolation.py
          python scripts/test_failure_modes.py
