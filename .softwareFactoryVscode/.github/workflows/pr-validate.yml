name: pr-validate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const required = [
              '## Summary',
              '## Linked issue',
              '## Scope and affected areas',
              '## Validation / evidence',
              '## Cross-repo impact',
              '## Follow-ups'
            ];
            const missing = required.filter(section => !body.includes(section));
            if (missing.length) {
              core.setFailed(`Missing PR template sections: ${missing.join(', ')}`);
            }
