name: remote-bootstrap-verify

on:
  workflow_dispatch:

jobs:
  verify-remote-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python scripts/check_docs_accuracy.py
      - run: test -f .github/ISSUE_TEMPLATE/feature_request.yml
      - run: test -f .github/pull_request_template.md
      - run: test -f manifests/github-labels.json
