name: ci-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'compose/**'
      - 'docker/**'
      - 'factory_runtime/**'
      - 'requirements.txt'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build key images
        run: |
          docker build -f docker/mcp-memory/Dockerfile .
          docker build -f docker/mcp-agent-bus/Dockerfile .
          docker build -f docker/approval-gate/Dockerfile .
          docker build -f docker/agent-worker/Dockerfile .
          docker build -f docker/context7/Dockerfile .
