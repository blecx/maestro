policy:
  version: 1.0
  description: "Neutral default policy for isolated software factory runtime"
  allow:
    - "^ls"
    - "^pwd"
    - "^cat"
    - "^grep"
    - "^find"
  deny:
    - "rm -rf /"
    - "^mkfs"
  sandbox_dir: ".tmp/softwareFactoryVscode/sandbox"
  max_execution_time_seconds: 30
